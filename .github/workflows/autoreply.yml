name: autoreply

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub may start it a few minutes late)
    - cron: "17 3 1,15 * *" # twice a month: keepalive commit, so GitHub never pauses the schedule (60-day rule)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (send nothing)"
        type: boolean
        default: false

concurrency:
  group: autoreply
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      IG_TOKEN: ${{ secrets.IG_TOKEN }}
      IG_USER_ID: "17841414351865744"
      IG_USERNAME: hemanth_chakka
      STATE_FILE: state/state.json
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: autoreply-state-${{ github.run_id }}
          restore-keys: autoreply-state-

      - name: Answer SAFE / CODE comments
        run: python autoreply.py ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: autoreply-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Keepalive commit
        if: github.event.schedule == '17 3 1,15 * *'
        run: |
          date -u +%Y-%m-%dT%H:%MZ > .keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git commit -m "keepalive" && git push || true

name: autoreply

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub may start it a few minutes late)
    - cron: "17 3 1,15 * *" # twice a month: keepalive commit, so GitHub never pauses the schedule (60-day rule)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (send nothing)"
        type: boolean
        default: false
      selftest:
        description: "Self-test: print replies for made-up comments (touches no account)"
        type: boolean
        default: false

concurrency:
  # the self-test touches no account and no state, so it runs in its own lane and never waits for (or replaces) a live run
  group: ${{ (github.event_name == 'workflow_dispatch' && inputs.selftest) && 'autoreply-selftest' || 'autoreply' }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  actions: write
  models: read   # GitHub Models: writes each reply fresh (free with this workflow's own token)

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      IG_TOKEN: ${{ secrets.IG_TOKEN }}
      IG_USER_ID: "17841414351865744"
      IG_USERNAME: hemanth_chakka
      STATE_FILE: state/state.json
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optional: when set, Claude writes each reply fresh
    steps:
      - uses: actions/checkout@v4

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: autoreply-state-${{ github.run_id }}
          restore-keys: autoreply-state-

      - name: Posted steps for any new post (auto-DM entry + website live)
        # never blocks the DM replies below: a failure here only shows as a warning on the run
        if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.selftest || inputs.dry_run)) }}
        continue-on-error: true
        timeout-minutes: 7
        env:
          SITE_DEPLOY_KEY: ${{ secrets.SITE_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SITE_DEPLOY_KEY" > ~/.ssh/site_key && chmod 600 ~/.ssh/site_key
          ssh-keyscan -q github.com >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/site_key -o IdentitiesOnly=yes"
          python posted.py
          if ! git diff --quiet -- rules.json posted.json || [ -n "$(git ls-files --others -- posted.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add rules.json posted.json
            git commit -q -m "Posted steps (cloud): shortcode entry for the newest post"
            for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
          fi
          rm -f ~/.ssh/site_key

      - name: Self-test (made-up comments only)
        if: github.event_name == 'workflow_dispatch' && inputs.selftest
        run: python autoreply.py --selftest

      - name: Answer comments (each post's own resource)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.selftest) }}
        run: python autoreply.py --loop 240 ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}

      - name: Save state
        if: always() && !(github.event_name == 'workflow_dispatch' && inputs.selftest)
        uses: actions/cache/save@v4
        with:
          path: state
          key: autoreply-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Chain the next run (GitHub's */5 timer often fires only every few hours)
        if: always() && !(github.event_name == 'workflow_dispatch' && (inputs.dry_run || inputs.selftest))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Another live run already waiting or running (not this one)? Then it carries the chain.
          others=$(gh run list --workflow autoreply.yml --limit 20 --json databaseId,status \
            -q "[.[] | select(.databaseId != ${{ github.run_id }}) | select(.status == \"queued\" or .status == \"in_progress\" or .status == \"waiting\" or .status == \"pending\")] | length" || echo 0)
          if [ "${others:-0}" -gt 0 ]; then
            echo "another run is already queued or running: no chain needed"
          else
            echo "starting the next run"
            gh workflow run autoreply.yml --ref main -f dry_run=false
          fi

      - name: Keepalive commit
        if: github.event.schedule == '17 3 1,15 * *'
        run: |
          date -u +%Y-%m-%dT%H:%MZ > .keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git commit -m "keepalive" && git push || true

name: autoreply

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub may start it a few minutes late)
    - cron: "17 3 1,15 * *" # twice a month: keepalive commit, so GitHub never pauses the schedule (60-day rule)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (send nothing)"
        type: boolean
        default: false
      selftest:
        description: "Self-test: print replies for made-up comments (touches no account)"
        type: boolean
        default: false

concurrency:
  # the self-test touches no account and no state, so it runs in its own lane and never waits for (or replaces) a live run
  group: ${{ (github.event_name == 'workflow_dispatch' && inputs.selftest) && 'autoreply-selftest' || 'autoreply' }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  actions: write
  models: read   # GitHub Models: writes each reply fresh (free with this workflow's own token)

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      IG_TOKEN: ${{ secrets.IG_TOKEN }}
      IG_USER_ID: "17841414351865744"
      IG_USERNAME: hemanth_chakka
      STATE_FILE: state/state.json
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optional: when set, Claude writes each reply fresh
    steps:
      - uses: actions/checkout@v4

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: autoreply-state-${{ github.run_id }}
          restore-keys: autoreply-state-

      - name: Self-test (made-up comments only)
        if: github.event_name == 'workflow_dispatch' && inputs.selftest
        run: python autoreply.py --selftest

      - name: Answer comments (each post's own resource)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.selftest) }}
        run: python autoreply.py --loop 240 ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}

      - name: Save state
        if: always() && !(github.event_name == 'workflow_dispatch' && inputs.selftest)
        uses: actions/cache/save@v4
        with:
          path: state
          key: autoreply-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Backup trigger (only when GitHub's timer is not firing)
        if: always() && !(github.event_name == 'workflow_dispatch' && (inputs.dry_run || inputs.selftest))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          last=$(gh run list --workflow autoreply.yml --event schedule --limit 1 --json createdAt -q '.[0].createdAt' || true)
          now=$(date -u +%s)
          if [ -n "$last" ] && [ $(( now - $(date -u -d "$last" +%s) )) -lt 720 ]; then
            echo "timer is firing (last timed run $last): no backup needed"
          else
            echo "no timed run in the last 12 minutes: starting the next run"
            gh workflow run autoreply.yml --ref main -f dry_run=false
          fi

      - name: Keepalive commit
        if: github.event.schedule == '17 3 1,15 * *'
        run: |
          date -u +%Y-%m-%dT%H:%MZ > .keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git commit -m "keepalive" && git push || true
